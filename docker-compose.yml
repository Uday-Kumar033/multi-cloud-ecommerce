services:

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USER: postgres
      DB_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5000:5000"


  frontend:
    build:
      context: ./frontend

    depends_on:
      - backend

    ports:
      - "3000:80"


volumes:
  postgres_data:
