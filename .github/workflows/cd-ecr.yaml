name: CD - Build and Push to ECR

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  ECR_BACKEND_REPOSITORY: multi-cloud-ecommerce-backend
  ECR_FRONTEND_REPOSITORY: multi-cloud-ecommerce-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image information
        id: image
        run: |
          echo "registry=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.image.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ steps.image.outputs.tag }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ steps.image.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ steps.image.outputs.tag }} \
            ./frontend

      - name: Push backend image
        run: |
          docker push \
            ${{ steps.image.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ steps.image.outputs.tag }}

      - name: Push frontend image
        run: |
          docker push \
            ${{ steps.image.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ steps.image.outputs.tag }}

      - name: Update Kubernetes backend image
        run: |
          sed -i "s|image: REPLACE_WITH_ECR_BACKEND_IMAGE|image: ${{ steps.image.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ steps.image.outputs.tag }}|" k8s/backend.yaml

      - name: Update Kubernetes frontend image
        run: |
          sed -i "s|image: REPLACE_WITH_ECR_FRONTEND_IMAGE|image: ${{ steps.image.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ steps.image.outputs.tag }}|" k8s/frontend.yaml

      - name: Commit Kubernetes manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/backend.yaml k8s/frontend.yaml

          git diff --cached --quiet || \
            git commit -m "chore: update ECR image tags [skip ci]"

          git push origin main
